<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Cupcake Gourmet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🧁 Cupcake Gourmet</h1>
        <p>Os melhores cupcakes artesanais na sua porta!</p>
    </header>

    <main>
        <h2>Nosso Cardápio</h2>
        <div id="lista-cupcakes" class="grid-cupcakes">
            <p>Carregando deliciosos cupcakes...</p>
        </div>

        <section id="carrinho-secao">
            <h2>Fazer Pedido de Teste</h2>
            <button id="btn-pedido" onclick="fazerPedido()">Finalizar Pedido Simulado</button>
            <p id="mensagem-status"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
